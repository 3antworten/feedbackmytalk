services:
  server:
    build:
      context: ./server
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-production}
      APP_DOMAIN: ${APP_DOMAIN:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - feedback_data:/app/data
      - feedback_uploads:/app/uploads
    expose:
      - "3001"
    restart: unless-stopped

  web:
    build:
      context: ./client
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  feedback_data:
  feedback_uploads:
